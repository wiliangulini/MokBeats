<section #button>
  <app-button-whats></app-button-whats>
</section>
<footer #footer>
  <div class="container">
    <div class="row justify-content-center align-items-start">
      <div class="col-sm-3 col-md-3 col-lg-3 col-xl-3 d-flex flex-column align-items-start justify-content-start">
        <p class="h5 text-uppercase">coleções</p>
        <ul class="m-0 p-0">
          <li *ngFor="let col of collections">
            <a [routerLink]="['/musicas']">{{col.viewValue}}</a>
          </li>
        </ul>
      </div>
      <div class="col-sm-3 col-md-3 col-lg-3 col-xl-3 d-flex flex-column align-items-start justify-content-start">
        <p class="h5">INFORMAÇÕES</p>
        <ul class="m-0 p-0">
          <li *ngFor="let i of info">
            <a [routerLink]="[i.route]">{{i.viewValue}}</a>
          </li>
        </ul>
      </div>
      <div class="col-sm-3 col-md-3 col-lg-3 col-xl-3 d-flex flex-column align-items-start justify-content-start">
        <p class="h5">COMPOSITORES</p>
        <ul class="m-0 p-0">
          <li>
            <a [routerLink]="['/produtores']">Enviar Música</a>
          </li>
        </ul>
      </div>
      <div class="col-sm-3 col-md-3 col-lg-3 col-xl-3 d-flex flex-column align-items-start justify-content-start">
        <p class="h5">SUPORTE</p>
        <ul class="m-0 p-0">
          <li *ngFor="let sup of support">
            <a [routerLink]="[sup.route]">{{sup.viewValue}}</a>
          </li>
          <li>
            <a [href]="url" target="_blank" rel="noopener noreferrer">Fale Conosco via WhatsApp</a>
          </li>
          <li>
            <a [href]="hubUrl" target="_blank" rel="noopener noreferrer">HUB</a>
          </li>
        </ul>
      </div>
    </div>
    <!-- Pendencia: renderizar LinkedIn e redes sociais somente quando URLs oficiais do MokBeats forem informadas. -->
