<app-filter></app-filter>
<section id="genero" class="genero px-3 px-lg-5 pt-0 pb-3">
  <div class="container-fluid">
    <div class="row title justify-content-start align-items-center mb-5">
      <h1>Gênero</h1>
    </div>
    <div class="row mb-5 row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-5 g-3">
      <div class="col" *ngFor="let g of titles; let i = index;">
        <div class="div2 pt-3 h-100">
          <a href="" class="h5 d-block">{{ g }}</a>
          <div class="textMusic d-flex flex-column mt-3 mb-3 pb-3">
            <a *ngFor="let mus of music[i];" href="#" class="h6 pl-3">{{ mus }}</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<app-footer></app-footer>
